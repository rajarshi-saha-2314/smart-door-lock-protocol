[project]
name = "smart-door-lock-protocol"
version = "1.0.0"
description = "CS428 - Secure user authentication protocol for a classroom smart door lock (simulation)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# protocol notation (N1, TID, C_U, Auth_DL, ...) is intentionally kept in variable names
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
